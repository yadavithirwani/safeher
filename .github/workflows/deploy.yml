# Test, then deploy SafeHer (Cloud Run + Firebase Hosting) on every push to main.
# No keys are stored in GitHub: the run signs in to Google with Workload Identity Federation, which only
# trusts main of yadavithirwani/safeher. One-time setup: scripts/setup_ci.sh. The tests make no Gemini or
# Maps calls (conftest.py hides every key). After rebuilding the data, upload it: scripts/setup_ci.sh --data
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "demo/**", "dashboard/**"]
  workflow_dispatch:   # Actions → Deploy → Run workflow (e.g. after uploading new data)

concurrency:
  group: deploy
  cancel-in-progress: false   # never cut a deploy off halfway; the next one waits

permissions:
  contents: read
  id-token: write             # lets the run ask GitHub for a token to present to Google

env:
  WIF_PROVIDER: projects/116809948556/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER: safeher-deployer@safeher-511808.iam.gserviceaccount.com
  DATA: gs://safeher-511808-data/safeher.duckdb

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Fetch the data (data/safeher.duckdb is not in Git)
        run: gcloud storage cp "$DATA" data/safeher.duckdb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Test
        working-directory: backend
        run: .venv/bin/pytest -q -x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Deploy (Cloud Run + Hosting)
        run: scripts/deploy.sh --app
