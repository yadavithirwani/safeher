[project]
name = "safeher-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "astral", "osmnx>=2.0", "opening-hours-py", "numpy", "python-dotenv", "duckdb", "google-adk==2.12.0", "litellm==1.105.1", "truststore==0.10.5", "google-cloud-firestore>=2.16"]

[project.optional-dependencies]
# Only for `python -m safeher.data build` (not needed by the server or its container).
build = ["osmium", "blackmarblepy"]
dev = ["pytest", "playwright", "imageio-ffmpeg", "hypothesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["safeher*"]
