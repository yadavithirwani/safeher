<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" role="img" aria-label="Seven data sources. Four are fetched once by a build pipeline into a read-only DuckDB database; Google Maps and Gemini are called live per request; people using the app write reports and live-sharing sessions to SQLite through the backend."><style>svg{--bg:#F6F4F8;--surface:#FFFFFF;--ink:#1D1A22;--muted:#5D5866;--line:#D9D4E0;--violet:#5B2A86;--violet-soft:#EEE6F6;--amber:#B26A00;--amber-soft:#FBEFD9;--teal:#13786A;--teal-soft:#E0F2EF;--body:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}@media (prefers-color-scheme: dark){svg{--bg:#141218;--surface:#1D1A22;--ink:#EDEAF2;--muted:#A9A3B3;--line:#37323F;--violet:#C9A7EB;--violet-soft:#2D2338;--amber:#F2B65A;--amber-soft:#36291A;--teal:#5CC9B8;--teal-soft:#17302C}}.canvas{fill:var(--surface)}.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.src { stroke: var(--amber); fill: var(--amber-soft); }
.src-live { stroke: var(--teal); fill: var(--teal-soft); }
.build { stroke: var(--amber); }
.store { stroke: var(--violet); fill: var(--violet-soft); }
.backend { stroke: var(--ink); stroke-width: 2; }
.head { fill: var(--violet-soft); stroke: var(--violet); }
.band { fill: var(--bg); stroke: none; }
.life { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 5; }
.edge { fill: none; stroke: currentColor; stroke-width: 1.5; }
.edge.ret { stroke-dasharray: 5 4; }
.ahead { fill: currentColor; }
.dot { fill: currentColor; }
.t { fill: currentColor; font: 400 13px var(--body); }
.strong { font-weight: 600; font-size: 14px; }
.small { fill: var(--muted); font-size: 12px; }
.mono { font: 500 10.5px var(--mono); fill: var(--violet); }
.tag { fill: var(--amber); font: 500 11px var(--mono); }
.tag-live { fill: var(--teal); font: 500 11px var(--mono); }
.eyebrow { fill: var(--muted); font: 600 11px var(--mono); letter-spacing: .12em; }
.lbl { fill: currentColor; font: 400 12px var(--body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
</style><rect class="canvas" width="1140" height="660" rx="14"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs><rect x="20" y="64" width="300" height="62" rx="8" class="box src"/><text x="34" y="86" class="t strong" text-anchor="start">Geofabrik OSM extracts</text><text x="34" y="104" class="t small" text-anchor="start">streets, lit tags, places, lamps, districts</text><text x="34" y="119" class="t tag" text-anchor="start">build · no key</text><rect x="20" y="140" width="300" height="62" rx="8" class="box src"/><text x="34" y="162" class="t strong" text-anchor="start">NASA Black Marble (LAADS)</text><text x="34" y="180" class="t small" text-anchor="start">night lights, ~500 m pixels</text><text x="34" y="195" class="t tag" text-anchor="start">build · Earthdata token</text><rect x="20" y="216" width="300" height="62" rx="8" class="box src"/><text x="34" y="238" class="t strong" text-anchor="start">NCRB via India Data Portal</text><text x="34" y="256" class="t small" text-anchor="start">Delhi crimes against women, by district</text><text x="34" y="271" class="t tag" text-anchor="start">build · no key</text><rect x="20" y="292" width="300" height="62" rx="8" class="box src"/><text x="34" y="314" class="t strong" text-anchor="start">Bengaluru City Police · OpenCity</text><text x="34" y="332" class="t small" text-anchor="start">city-wide crimes against women 2021–23</text><text x="34" y="347" class="t tag" text-anchor="start">build · no key</text><rect x="20" y="368" width="300" height="62" rx="8" class="box src-live"/><text x="34" y="390" class="t strong" text-anchor="start">Google Maps Platform</text><text x="34" y="408" class="t small" text-anchor="start">tiles, places, routes, Street View</text><text x="34" y="423" class="t tag-live" text-anchor="start">live · API key</text><rect x="20" y="444" width="300" height="62" rx="8" class="box src-live"/><text x="34" y="466" class="t strong" text-anchor="start">Gemini API</text><text x="34" y="484" class="t small" text-anchor="start">route explanations</text><text x="34" y="499" class="t tag-live" text-anchor="start">live · API key</text><rect x="20" y="520" width="300" height="62" rx="8" class="box src-live"/><text x="34" y="542" class="t strong" text-anchor="start">People using SafeHer</text><text x="34" y="560" class="t small" text-anchor="start">reports, live GPS while sharing</text><text x="34" y="575" class="t tag-live" text-anchor="start">live · in the app</text><text x="20" y="44" class="t eyebrow" text-anchor="start">SOURCES</text><text x="372" y="44" class="t eyebrow" text-anchor="start">FETCHED ONCE</text><text x="632" y="44" class="t eyebrow" text-anchor="start">STORED</text><text x="942" y="44" class="t eyebrow" text-anchor="start">SERVED</text><rect x="372" y="64" width="220" height="290" rx="8" class="box build"/><text x="386" y="90" class="t strong" text-anchor="start">Build pipeline</text><text x="386" y="112" class="t mono" text-anchor="start">python -m safeher.data build</text><text x="386" y="134" class="t small" text-anchor="start">download + verify checksum</text><text x="386" y="156" class="t small" text-anchor="start">cut each city’s bbox</text><text x="386" y="178" class="t small" text-anchor="start">walk rules, place types</text><text x="386" y="200" class="t small" text-anchor="start">validate, then swap in</text><polyline points="320,95.0 368,95.0" class="edge" marker-end="url(#ah)"/><polyline points="320,171.0 368,171.0" class="edge" marker-end="url(#ah)"/><polyline points="320,247.0 368,247.0" class="edge" marker-end="url(#ah)"/><polyline points="320,323.0 368,323.0" class="edge" marker-end="url(#ah)"/><rect x="632" y="64" width="210" height="290" rx="8" class="box store" stroke-dasharray="6 5"/><text x="646" y="90" class="t strong" text-anchor="start">safeher.duckdb</text><text x="646" y="112" class="t small" text-anchor="start">read-only, shared by workers</text><text x="646" y="134" class="t small" text-anchor="start">segments · 1.6 M streets</text><text x="646" y="156" class="t small" text-anchor="start">places · 84 k</text><text x="646" y="178" class="t small" text-anchor="start">night_lights · 21 k pixels</text><text x="646" y="200" class="t small" text-anchor="start">districts → incidents</text><text x="646" y="222" class="t small" text-anchor="start">city_stats · Bengaluru</text><polyline points="592,209.0 628,209.0" class="edge" marker-end="url(#ah)"/><text x="612.0" y="201.0" class="lbl" text-anchor="middle">writes</text><rect x="942" y="64" width="178" height="518" rx="8" class="box backend"/><text x="956" y="90" class="t strong" text-anchor="start">Backend</text><text x="956" y="112" class="t small" text-anchor="start">FastAPI · 4 workers</text><text x="956" y="156" class="t small" text-anchor="start">corridor builder</text><text x="956" y="178" class="t small" text-anchor="start">(in-memory cache)</text><text x="956" y="200" class="t small" text-anchor="start">routing · scoring</text><text x="956" y="222" class="t small" text-anchor="start">Plan B coverage</text><text x="956" y="244" class="t small" text-anchor="start">explain + fact checks</text><text x="956" y="266" class="t small" text-anchor="start">search · nearby</text><text x="956" y="288" class="t small" text-anchor="start">reports · sharing</text><text x="956" y="332" class="t small" text-anchor="start">No key ever</text><text x="956" y="354" class="t small" text-anchor="start">reaches the browser</text><polyline points="842,209.0 938,209.0" class="edge" marker-end="url(#ah)"/><text x="892.0" y="201.0" class="lbl" text-anchor="middle">reads corridor</text><polyline points="320,399.0 938,399.0" class="edge" marker-end="url(#ah)"/><text x="607.0" y="391.0" class="lbl" text-anchor="middle">per request · nothing stored</text><polyline points="320,475.0 938,475.0" class="edge" marker-end="url(#ah)"/><text x="607.0" y="467.0" class="lbl" text-anchor="middle">per request · fact-checked</text><rect x="632" y="514" width="210" height="74" rx="8" class="box store" stroke-dasharray="6 5"/><text x="646" y="538" class="t strong" text-anchor="start">safeher.sqlite3</text><text x="646" y="558" class="t small" text-anchor="start">reports · live-sharing sessions</text><text x="646" y="576" class="t small" text-anchor="start">hashed links, deleted after 2 h</text><line x1="942" y1="551.0" x2="846" y2="551.0" class="edge" marker-end="url(#ah)"/><text x="892.0" y="543.0" class="lbl" text-anchor="middle">writes</text><polyline points="320,551.0 432,551.0 432,640 1031.0,640 1031.0,586" class="edge" marker-end="url(#ah)"/><text x="492" y="632" class="lbl" text-anchor="start">app and /live viewer, over HTTPS</text></svg>