<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1216" role="img" aria-label="Sequence of one trip: search with local index and Google Autocomplete, plan with a DuckDB corridor plus Google’s walking route scored by SafeHer, explain with Gemini and fact checks, map tiles and nearby places from Google, and reports and live sharing stored in SQLite."><style>svg{--bg:#F6F4F8;--surface:#FFFFFF;--ink:#1D1A22;--muted:#5D5866;--line:#D9D4E0;--violet:#5B2A86;--violet-soft:#EEE6F6;--amber:#B26A00;--amber-soft:#FBEFD9;--teal:#13786A;--teal-soft:#E0F2EF;--body:system-ui,-apple-system,'Segoe UI',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}@media (prefers-color-scheme: dark){svg{--bg:#141218;--surface:#1D1A22;--ink:#EDEAF2;--muted:#A9A3B3;--line:#37323F;--violet:#C9A7EB;--violet-soft:#2D2338;--amber:#F2B65A;--amber-soft:#36291A;--teal:#5CC9B8;--teal-soft:#17302C}}.canvas{fill:var(--surface)}.box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.src { stroke: var(--amber); fill: var(--amber-soft); }
.src-live { stroke: var(--teal); fill: var(--teal-soft); }
.build { stroke: var(--amber); }
.store { stroke: var(--violet); fill: var(--violet-soft); }
.backend { stroke: var(--ink); stroke-width: 2; }
.head { fill: var(--violet-soft); stroke: var(--violet); }
.band { fill: var(--bg); stroke: none; }
.life { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 5; }
.edge { fill: none; stroke: currentColor; stroke-width: 1.5; }
.edge.ret { stroke-dasharray: 5 4; }
.ahead { fill: currentColor; }
.dot { fill: currentColor; }
.t { fill: currentColor; font: 400 13px var(--body); }
.strong { font-weight: 600; font-size: 14px; }
.small { fill: var(--muted); font-size: 12px; }
.mono { font: 500 10.5px var(--mono); fill: var(--violet); }
.tag { fill: var(--amber); font: 500 11px var(--mono); }
.tag-live { fill: var(--teal); font: 500 11px var(--mono); }
.eyebrow { fill: var(--muted); font: 600 11px var(--mono); letter-spacing: .12em; }
.lbl { fill: currentColor; font: 400 12px var(--body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
</style><rect class="canvas" width="1140" height="1216" rx="14"/><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs><rect x="8" y="96" width="1124" height="244" rx="8" class="band"/><text x="18" y="111" class="t eyebrow" text-anchor="start">SEARCH</text><rect x="8" y="366" width="1124" height="184" rx="8" class="band"/><text x="18" y="381" class="t eyebrow" text-anchor="start">PLAN</text><rect x="8" y="576" width="1124" height="154" rx="8" class="band"/><text x="18" y="591" class="t eyebrow" text-anchor="start">EXPLAIN</text><rect x="8" y="756" width="1124" height="214" rx="8" class="band"/><text x="18" y="771" class="t eyebrow" text-anchor="start">ON THE MAP</text><rect x="8" y="996" width="1124" height="184" rx="8" class="band"/><text x="18" y="1011" class="t eyebrow" text-anchor="start">REPORT AND SHARE</text><line x1="100" y1="70" x2="100" y2="1210" class="life"/><rect x="24" y="14" width="152" height="50" rx="8" class="box head"/><text x="100" y="36" class="t strong" text-anchor="middle">Browser</text><text x="100" y="54" class="t small" text-anchor="middle">app/web</text><line x1="300" y1="70" x2="300" y2="1210" class="life"/><rect x="224" y="14" width="152" height="50" rx="8" class="box head"/><text x="300" y="36" class="t strong" text-anchor="middle">Backend</text><text x="300" y="54" class="t small" text-anchor="middle">FastAPI</text><line x1="500" y1="70" x2="500" y2="1210" class="life"/><rect x="424" y="14" width="152" height="50" rx="8" class="box head"/><text x="500" y="36" class="t strong" text-anchor="middle">Corridor</text><text x="500" y="54" class="t small" text-anchor="middle">DuckDB + cache</text><line x1="700" y1="70" x2="700" y2="1210" class="life"/><rect x="624" y="14" width="152" height="50" rx="8" class="box head"/><text x="700" y="36" class="t strong" text-anchor="middle">Google Maps</text><text x="700" y="54" class="t small" text-anchor="middle">Places · Routes · Tiles</text><line x1="880" y1="70" x2="880" y2="1210" class="life"/><rect x="804" y="14" width="152" height="50" rx="8" class="box head"/><text x="880" y="36" class="t strong" text-anchor="middle">Gemini</text><text x="880" y="54" class="t small" text-anchor="middle">explanations</text><line x1="1050" y1="70" x2="1050" y2="1210" class="life"/><rect x="974" y="14" width="152" height="50" rx="8" class="box head"/><text x="1050" y="36" class="t strong" text-anchor="middle">SQLite</text><text x="1050" y="54" class="t small" text-anchor="middle">user data</text><line x1="104" y1="130" x2="294" y2="130" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="124" class="lbl" text-anchor="middle">GET /api/search</text><circle cx="100" cy="130" r="3" class="dot"/><line x1="304" y1="160" x2="494" y2="160" class="edge" marker-end="url(#ah2)"/><text x="400.0" y="154" class="lbl" text-anchor="middle">places + street names</text><circle cx="300" cy="160" r="3" class="dot"/><line x1="304" y1="190" x2="694" y2="190" class="edge" marker-end="url(#ah2)"/><text x="500.0" y="184" class="lbl" text-anchor="middle">Autocomplete, restricted to the city</text><circle cx="300" cy="190" r="3" class="dot"/><line x1="296" y1="220" x2="106" y2="220" class="edge ret" marker-end="url(#ah2)"/><text x="200.0" y="214" class="lbl" text-anchor="middle">suggestions: local first, then Google</text><circle cx="300" cy="220" r="3" class="dot"/><line x1="104" y1="250" x2="294" y2="250" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="244" class="lbl" text-anchor="middle">GET /api/google/place/{id}</text><circle cx="100" cy="250" r="3" class="dot"/><line x1="304" y1="280" x2="694" y2="280" class="edge" marker-end="url(#ah2)"/><text x="500.0" y="274" class="lbl" text-anchor="middle">Place Details</text><circle cx="300" cy="280" r="3" class="dot"/><line x1="296" y1="310" x2="106" y2="310" class="edge ret" marker-end="url(#ah2)"/><text x="200.0" y="304" class="lbl" text-anchor="middle">lat, lon</text><circle cx="300" cy="310" r="3" class="dot"/><line x1="104" y1="400" x2="294" y2="400" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="394" class="lbl" text-anchor="middle">POST /api/plan  from, to, time</text><circle cx="100" cy="400" r="3" class="dot"/><line x1="304" y1="430" x2="494" y2="430" class="edge" marker-end="url(#ah2)"/><text x="400.0" y="424" class="lbl" text-anchor="middle">corridor → graph · districts</text><circle cx="300" cy="430" r="3" class="dot"/><line x1="304" y1="460" x2="694" y2="460" class="edge" marker-end="url(#ah2)"/><text x="500.0" y="454" class="lbl" text-anchor="middle">Routes API: Google’s walking route</text><circle cx="300" cy="460" r="3" class="dot"/><path d="M300,484 h46 v16 h-42" class="edge" marker-end="url(#ah2)"/><text x="354" y="496" class="lbl" text-anchor="start">score every 50 m · 5 signals · Plan B</text><circle cx="300" cy="490" r="3" class="dot"/><line x1="296" y1="520" x2="106" y2="520" class="edge ret" marker-end="url(#ah2)"/><text x="200.0" y="514" class="lbl" text-anchor="middle">routes, scores, weak stretches, stops</text><circle cx="300" cy="520" r="3" class="dot"/><line x1="104" y1="610" x2="294" y2="610" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="604" class="lbl" text-anchor="middle">POST /api/explain</text><circle cx="100" cy="610" r="3" class="dot"/><line x1="304" y1="640" x2="874" y2="640" class="edge" marker-end="url(#ah2)"/><text x="590.0" y="634" class="lbl" text-anchor="middle">facts JSON from the cached plan</text><circle cx="300" cy="640" r="3" class="dot"/><line x1="876" y1="670" x2="306" y2="670" class="edge ret" marker-end="url(#ah2)"/><text x="590.0" y="664" class="lbl" text-anchor="middle">text → fact checks, 1 retry</text><circle cx="880" cy="670" r="3" class="dot"/><line x1="296" y1="700" x2="106" y2="700" class="edge ret" marker-end="url(#ah2)"/><text x="200.0" y="694" class="lbl" text-anchor="middle">explanation, or 502 with the reason</text><circle cx="300" cy="700" r="3" class="dot"/><line x1="104" y1="790" x2="294" y2="790" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="784" class="lbl" text-anchor="middle">GET /api/google/tiles/…</text><circle cx="100" cy="790" r="3" class="dot"/><line x1="304" y1="820" x2="694" y2="820" class="edge" marker-end="url(#ah2)"/><text x="500.0" y="814" class="lbl" text-anchor="middle">Map Tiles (proxied, not cached)</text><circle cx="300" cy="820" r="3" class="dot"/><line x1="104" y1="850" x2="294" y2="850" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="844" class="lbl" text-anchor="middle">GET /api/layers (zoom ≥ 14)</text><circle cx="100" cy="850" r="3" class="dot"/><line x1="304" y1="880" x2="494" y2="880" class="edge" marker-end="url(#ah2)"/><text x="400.0" y="874" class="lbl" text-anchor="middle">lamps · lit streets · night lights</text><circle cx="300" cy="880" r="3" class="dot"/><line x1="104" y1="910" x2="294" y2="910" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="904" class="lbl" text-anchor="middle">GET /api/nearby</text><circle cx="100" cy="910" r="3" class="dot"/><line x1="304" y1="940" x2="694" y2="940" class="edge" marker-end="url(#ah2)"/><text x="500.0" y="934" class="lbl" text-anchor="middle">Nearby, live open-now (leaving now)</text><circle cx="300" cy="940" r="3" class="dot"/><line x1="104" y1="1030" x2="294" y2="1030" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="1024" class="lbl" text-anchor="middle">POST /api/reports</text><circle cx="100" cy="1030" r="3" class="dot"/><line x1="304" y1="1060" x2="1044" y2="1060" class="edge" marker-end="url(#ah2)"/><text x="675.0" y="1054" class="lbl" text-anchor="middle">snapped to a street; plan cache refreshes</text><circle cx="300" cy="1060" r="3" class="dot"/><line x1="104" y1="1090" x2="294" y2="1090" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="1084" class="lbl" text-anchor="middle">POST /api/trips</text><circle cx="100" cy="1090" r="3" class="dot"/><line x1="304" y1="1120" x2="1044" y2="1120" class="edge" marker-end="url(#ah2)"/><text x="675.0" y="1114" class="lbl" text-anchor="middle">hashed links, 2 h expiry</text><circle cx="300" cy="1120" r="3" class="dot"/><line x1="104" y1="1150" x2="294" y2="1150" class="edge" marker-end="url(#ah2)"/><text x="200.0" y="1144" class="lbl" text-anchor="middle">contact’s /live page polls every 5 s</text><circle cx="100" cy="1150" r="3" class="dot"/></svg>